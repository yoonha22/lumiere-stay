<!doctype html>
<html lang="ko">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Lumière Stay</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link
            href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Inter:wght@300;400;500&display=swap"
            rel="stylesheet"
        />
        <style>
            *,
            *::before,
            *::after {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }
            body {
                background: #faf7f2;
                font-family: 'Inter', sans-serif;
                color: #2c2416;
            }
            button {
                cursor: pointer;
                font-family: inherit;
            }
            textarea {
                font-family: inherit;
            }

            @keyframes fadeUp {
                from {
                    opacity: 0;
                    transform: translateY(12px);
                }
                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }
            @keyframes bounce {
                0%,
                80%,
                100% {
                    transform: scale(0.8);
                    opacity: 0.3;
                }
                40% {
                    transform: scale(1.2);
                    opacity: 1;
                }
            }
            @keyframes spin {
                from {
                    transform: rotate(0deg);
                }
                to {
                    transform: rotate(360deg);
                }
            }
            .fade-up {
                animation: fadeUp 0.45s ease both;
            }
            .fade-up:nth-child(2) {
                animation-delay: 0.08s;
            }
            .fade-up:nth-child(3) {
                animation-delay: 0.16s;
            }
            .fade-up:nth-child(4) {
                animation-delay: 0.24s;
            }

            .chip {
                padding: 6px 15px;
                border-radius: 100px;
                font-size: 12px;
                border: 1px solid #ddd5c8;
                background: #fff;
                color: #8a7560;
                transition: all 0.18s;
            }
            .chip:hover,
            .chip.active {
                border-color: #a68558;
                color: #6b5233;
                background: rgba(139, 111, 71, 0.08);
            }
            .chip.active {
                background: rgba(139, 111, 71, 0.12);
            }

            .rel-btn {
                padding: 9px 18px;
                border-radius: 100px;
                font-size: 13px;
                border: 1px solid #ddd5c8;
                background: #fff;
                color: #8a7560;
                transition: all 0.18s;
                display: flex;
                align-items: center;
                gap: 7px;
            }
            .rel-btn:hover,
            .rel-btn.active {
                border-color: #a68558;
                background: rgba(139, 111, 71, 0.08);
                color: #6b5233;
            }

            .brow {
                padding: 12px 16px;
                border-radius: 10px;
                border: 1px solid #ddd5c8;
                background: #f3ede3;
                text-align: left;
                display: flex;
                align-items: center;
                gap: 14px;
                transition: all 0.18s;
                width: 100%;
            }
            .brow:hover,
            .brow.active {
                border-color: #a68558;
                background: rgba(139, 111, 71, 0.06);
            }

            .hsel {
                background: #fff;
                border-radius: 16px;
                overflow: hidden;
                cursor: pointer;
                border: 1.5px solid #ddd5c8;
                box-shadow: 0 2px 12px rgba(0, 0, 0, 0.05);
                transition: all 0.2s;
                display: flex;
                flex-direction: column;
            }
            .hsel:hover {
                border-color: #a68558;
                box-shadow: 0 4px 20px rgba(139, 111, 71, 0.15);
            }
            .hsel.selected {
                border-color: #8b6f47;
                box-shadow: 0 6px 28px rgba(139, 111, 71, 0.2);
            }

            .pbtn {
                width: 100%;
                padding: 14px;
                border-radius: 12px;
                border: none;
                background: #8b6f47;
                color: #fff;
                font-size: 15px;
                font-weight: 500;
                letter-spacing: 0.06em;
                transition: background 0.18s;
            }
            .pbtn:hover:not(:disabled) {
                background: #6b5233;
            }
            .pbtn:disabled {
                opacity: 0.4;
                cursor: not-allowed;
            }

            .gbtn {
                flex: 1;
                padding: 14px;
                border-radius: 12px;
                border: 1px solid #ddd5c8;
                background-color: #ffffff;
                background-image: none;
                color: #b8a898;
                font-size: 13px;
                transition: all 0.18s;
                appearance: none;
                -webkit-appearance: none;
                opacity: 1;
            }
            .gbtn:hover {
                border-color: #b8a898;
                color: #8a7560;
            }

            .stepper-btn {
                width: 32px;
                height: 32px;
                border-radius: 50%;
                border: 1px solid #ddd5c8;
                background: #fff;
                font-size: 18px;
                color: #8a7560;
                display: flex;
                align-items: center;
                justify-content: center;
                transition: all 0.18s;
            }
            .stepper-btn:hover {
                border-color: #8b6f47;
                color: #8b6f47;
            }

            .card {
                background: #fff;
                border: 1px solid #ddd5c8;
                border-radius: 16px;
                padding: 1.5rem;
                box-shadow: 0 2px 12px rgba(0, 0, 0, 0.04);
                margin-bottom: 14px;
            }

            .detail-btn {
                width: 100%;
                padding: 10px 1.4rem;
                background: #f3ede3;
                border: none;
                border-top: 1px solid #ddd5c8;
                font-size: 11px;
                color: #b8a898;
                text-align: left;
                display: flex;
                justify-content: space-between;
                align-items: center;
                letter-spacing: 0.1em;
                text-transform: uppercase;
                transition: color 0.18s;
            }
            .detail-btn:hover {
                color: #8b6f47;
            }

            .serif {
                font-family: 'Cormorant Garamond', Georgia, serif;
            }
            .hidden {
                display: none;
            }

            @media (max-width: 480px) {
                .hotel-grid {
                    grid-template-columns: 1fr !important;
                }
                h1.serif {
                    font-size: 30px !important;
                }
            }
        </style>
    </head>
    <body>
        <!-- ========== HEADER ========== -->
        <div
            style="
                background: #fff;
                border-bottom: 1px solid #ddd5c8;
                text-align: center;
                padding: 2.5rem 1rem 2rem;
            "
        >
            <p
                style="
                    font-size: 10px;
                    color: #a68558;
                    letter-spacing: 0.3em;
                    text-transform: uppercase;
                    margin-bottom: 10px;
                "
            >
                AI Concierge · Hôtel & Voyage
            </p>
            <h1
                class="serif"
                style="
                    font-size: 38px;
                    font-weight: 300;
                    letter-spacing: 0.06em;
                    color: #2c2416;
                    margin-bottom: 6px;
                "
            >
                Lumière Stay
            </h1>
            <p
                class="serif"
                style="
                    font-size: 14px;
                    font-style: italic;
                    color: #b8a898;
                    margin-bottom: 16px;
                "
            >
                Votre séjour parfait, curé par l'IA
            </p>
            <div
                style="
                    display: flex;
                    justify-content: center;
                    gap: 6px;
                    align-items: center;
                "
            >
                <div
                    style="width: 24px; height: 1px; background: #ddd5c8"
                ></div>
                <span style="font-size: 12px; color: #a68558">✦</span>
                <div
                    style="width: 24px; height: 1px; background: #ddd5c8"
                ></div>
            </div>
        </div>

        <div
            style="max-width: 580px; margin: 0 auto; padding: 2rem 1rem 3rem"
            id="app"
        >
            <!-- STEP INDICATOR -->
            <div
                id="step-indicator"
                style="
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    margin-bottom: 2rem;
                "
            ></div>

            <!-- ERROR -->
            <p
                id="error-msg"
                class="hidden"
                style="
                    color: #c0392b;
                    text-align: center;
                    font-size: 13px;
                    margin-bottom: 1rem;
                "
            ></p>

            <!-- LOADING -->
            <div
                id="loading"
                class="hidden"
                style="text-align: center; padding: 4rem 0"
            >
                <div
                    class="serif"
                    style="
                        font-size: 36px;
                        color: #a68558;
                        margin-bottom: 16px;
                        display: inline-block;
                        animation: spin 8s linear infinite;
                    "
                >
                    ✦
                </div>
                <p
                    id="loading-msg"
                    class="serif"
                    style="
                        font-size: 18px;
                        font-style: italic;
                        color: #8a7560;
                        margin-bottom: 6px;
                    "
                >
                    최적의 호텔을 찾고 있습니다…
                </p>
                <p
                    style="
                        font-size: 12px;
                        color: #b8a898;
                        margin-bottom: 28px;
                        letter-spacing: 0.08em;
                    "
                >
                    잠시만 기다려 주세요
                </p>
                <div style="display: flex; justify-content: center; gap: 8px">
                    <div
                        style="
                            width: 6px;
                            height: 6px;
                            border-radius: 50%;
                            background: #a68558;
                            animation: bounce 1.2s ease-in-out 0s infinite;
                        "
                    ></div>
                    <div
                        style="
                            width: 6px;
                            height: 6px;
                            border-radius: 50%;
                            background: #a68558;
                            animation: bounce 1.2s ease-in-out 0.2s infinite;
                        "
                    ></div>
                    <div
                        style="
                            width: 6px;
                            height: 6px;
                            border-radius: 50%;
                            background: #a68558;
                            animation: bounce 1.2s ease-in-out 0.4s infinite;
                        "
                    ></div>
                </div>
            </div>

            <!-- STEPS -->
            <div id="step1"></div>
            <div id="step2" class="hidden"></div>
            <div id="step3" class="hidden"></div>
            <div id="step4" class="hidden"></div>
        </div>

        <!-- FOOTER -->
        <div
            style="
                text-align: center;
                padding: 1.5rem;
                border-top: 1px solid #ddd5c8;
                background: #fff;
            "
        >
            <p
                class="serif"
                style="
                    margin: 0;
                    font-size: 12px;
                    font-style: italic;
                    color: #b8a898;
                "
            >
                Lumière Stay · Powered by Gemini
            </p>
        </div>

        <script>
            // ===== CONFIG =====
            // API 키는 Netlify 환경변수(GEMINI_API_KEY)에 저장되어 있고,
            // 호출은 /.netlify/functions/gemini 프록시를 통해 이루어집니다.

            // ===== DATA =====
            const REGIONS = [
                '서울',
                '부산',
                '제주',
                '강릉/속초',
                '경주',
                '전주',
                '여수',
                '수도권 근교',
                '도쿄',
                '오사카',
                '방콕',
                '발리',
                '파리',
                '뉴욕',
                '런던',
                '싱가포르',
                '홍콩',
                '바르셀로나',
            ];
            const PURPOSES = [
                '휴양/힐링',
                '가족여행',
                '커플/로맨틱',
                '비즈니스',
                '문화탐방',
                '액티비티/모험',
                '허니문',
                '친구 여행',
            ];
            const BUDGETS = [
                { label: 'Économique', sub: '1인 5만원 이하/박', icon: '🌿' },
                { label: 'Confort', sub: '1인 5~10만원/박', icon: '🏡' },
                { label: 'Supérieur', sub: '1인 10~20만원/박', icon: '🏨' },
                { label: 'Déluxe', sub: '1인 20~40만원/박', icon: '✦' },
                { label: 'Prestige', sub: '1인 40만원 이상/박', icon: '👑' },
            ];
            const AGE_GROUPS = [
                '유아(0-5세)',
                '어린이(6-12세)',
                '청소년(13-18세)',
                '20대',
                '30대',
                '40대',
                '50대',
                '60대 이상',
            ];
            const RELATIONS = [
                { label: '혼자', icon: '🧳' },
                { label: '커플', icon: '💑' },
                { label: '가족', icon: '👨‍👩‍👧' },
                { label: '친구들', icon: '👫' },
                { label: '비즈니스', icon: '💼' },
            ];
            // ===== STATE =====
            let state = {
                step: 1,
                adults: 2,
                children: 0,
                ageGroups: [],
                relation: '',
                region: '',
                nights: 2,
                budget: '',
                budgetLabel: '',
                purposes: [],
                extra: '',
                results: null,
                summary: '',
                selectedHotel: null,
                attractions: null,
                attrSummary: '',
            };

            // ===== API =====
            async function callGemini(
                prompt,
                loadingMsg,
                useGlobalLoading = true,
            ) {
                if (useGlobalLoading) showLoading(loadingMsg);
                const res = await fetch('/.netlify/functions/gemini', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt }),
                });
                const data = await res.json();
                if (!res.ok) {
                    const msg = data?.error?.message || `HTTP ${res.status}`;
                    if (res.status === 429) {
                        throw new Error(
                            '요청이 너무 많습니다. 1분 후 다시 시도해주세요. (Gemini 무료 티어 제한)',
                        );
                    }
                    throw new Error(`API 오류 (${res.status}): ${msg}`);
                }
                const text =
                    data.candidates?.[0]?.content?.parts?.[0]?.text || '';
                if (!text) {
                    throw new Error('응답이 비어있습니다. 다시 시도해주세요.');
                }
                return JSON.parse(text.replace(/```json|```/g, '').trim());
            }

            function hotelPrompt() {
                return `당신은 전문 호텔 추천 AI입니다. 아래 조건에 맞는 호텔 4개를 추천해주세요.
인원: 성인 ${state.adults}명, 어린이 ${state.children}명 / 연령대: ${state.ageGroups.join(',')} / 관계: ${state.relation}
여행지: ${state.region} / ${state.nights}박 / 예산: ${state.budget} / 목적: ${state.purposes.join(',')}
${state.extra ? `추가: ${state.extra}` : ''}
JSON만 출력:
{"summary":"감성적인 한줄 추천 코멘트(50자)","hotels":[{"name":"호텔명","location":"위치","rating":4.5,"price":"₩150,000~200,000","tags":["태그1","태그2","태그3"],"reason":"추천이유 2-3문장","details":"시설/주변명소 등 3-4문장"}]}`;
            }

            function attrPrompt(hotel) {
                return `당신은 여행 전문가입니다. 아래 호텔 주변의 놀거리/볼거리를 추천해주세요.
호텔: ${hotel.name} (${hotel.location}) / 여행지: ${state.region} / 목적: ${state.purposes.join(',')} / 관계: ${state.relation}
호텔에서 가기 좋은 주변 명소, 맛집, 카페, 액티비티 등 6개 추천.
JSON만 출력:
{"summary":"이 호텔에서 즐길 수 있는 한줄 소개(40자)","attractions":[{"name":"장소명","category":"맛집|카페|관광지|쇼핑|액티비티|자연|문화|야경 중 하나","location":"상세위치","distance":"예: 도보 5분","description":"2문장 설명","tip":"현지 꿀팁 한 문장"}]}`;
            }

            // ===== RENDER HELPERS =====
            function stars(r) {
                let s = '';
                for (let i = 1; i <= 5; i++)
                    s += `<span style="color:${i <= Math.round(r) ? '#A68558' : '#DDD5C8'};font-size:12px;">★</span>`;
                return (
                    s +
                    `<span style="font-size:12px;color:#B8A898;margin-left:6px;">${r.toFixed(1)}</span>`
                );
            }

            function chipHTML(label, active, dataAttr) {
                return `<button class="chip ${active ? 'active' : ''}" ${dataAttr}>${label}</button>`;
            }

            // ===== SHOW/HIDE =====
            function showLoading(msg) {
                document.getElementById('loading-msg').textContent =
                    msg || '잠시만 기다려 주세요…';
                document.getElementById('loading').classList.remove('hidden');
                ['step1', 'step2', 'step3', 'step4'].forEach(id =>
                    document.getElementById(id).classList.add('hidden'),
                );
            }

            function hideLoading() {
                document.getElementById('loading').classList.add('hidden');
                document
                    .getElementById('step-indicator')
                    .classList.remove('hidden');
            }

            function showError(msg) {
                const el = document.getElementById('error-msg');
                el.textContent = msg;
                el.classList.remove('hidden');
            }

            // ===== STEP INDICATOR =====
            function renderStepIndicator({ allDone = false } = {}) {
                const labels = ['여행자', '여행지', '목적', '추천'];
                const el = document.getElementById('step-indicator');
                el.innerHTML = labels
                    .map((label, i) => {
                        const s = i + 1,
                            active = !allDone && state.step === s,
                            done = allDone || state.step > s;
                        const circle = done
                            ? `<div style="width:28px;height:28px;border-radius:50%;background:#8B6F47;border:1px solid #8B6F47;display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff;">✓</div>`
                            : `<div style="width:28px;height:28px;border-radius:50%;background:#fff;border:1px solid ${active ? '#8B6F47' : '#DDD5C8'};display:flex;align-items:center;justify-content:center;font-size:11px;color:${active ? '#8B6F47' : '#B8A898'};">${s}</div>`;
                        const line =
                            i < 3
                                ? `<div style="width:36px;height:1px;background:${allDone || state.step > s ? 'rgba(139,111,71,0.5)' : '#DDD5C8'};margin:0 4px;margin-bottom:20px;"></div>`
                                : '';
                        return `<div style="display:flex;align-items:center;">
      <div style="display:flex;flex-direction:column;align-items:center;gap:5px;">
        ${circle}
        <span style="font-size:10px;color:${done ? '#8B6F47' : active ? '#8B6F47' : '#B8A898'};letter-spacing:0.06em;">${label}</span>
      </div>${line}</div>`;
                    })
                    .join('');
            }

            // ===== STEP 1 =====
            function renderStep1() {
                const el = document.getElementById('step1');
                el.classList.remove('hidden');
                el.innerHTML = `
    <div class="card">
      <p class="serif" style="font-size:17px;color:#2C2416;margin-bottom:14px;">여행 인원</p>
      <div style="display:flex;gap:3rem;">
        <div style="display:flex;flex-direction:column;gap:8px;">
          <span style="font-size:11px;color:#B8A898;letter-spacing:0.12em;text-transform:uppercase;">성인</span>
          <div style="display:flex;align-items:center;gap:16px;">
            <button class="stepper-btn" onclick="changeNum('adults',-1)">−</button>
            <span class="serif" id="adults-val" style="font-size:22px;min-width:24px;text-align:center;color:#2C2416;">${state.adults}</span>
            <button class="stepper-btn" onclick="changeNum('adults',1)">+</button>
          </div>
        </div>
        <div style="display:flex;flex-direction:column;gap:8px;">
          <span style="font-size:11px;color:#B8A898;letter-spacing:0.12em;text-transform:uppercase;">어린이</span>
          <div style="display:flex;align-items:center;gap:16px;">
            <button class="stepper-btn" onclick="changeNum('children',-1)">−</button>
            <span class="serif" id="children-val" style="font-size:22px;min-width:24px;text-align:center;color:#2C2416;">${state.children}</span>
            <button class="stepper-btn" onclick="changeNum('children',1)">+</button>
          </div>
        </div>
      </div>
    </div>

    <div class="card">
      <p class="serif" style="font-size:17px;color:#2C2416;margin-bottom:14px;">여행 유형</p>
      <div style="display:flex;flex-wrap:wrap;gap:10px;" id="relation-btns">
        ${RELATIONS.map(r => `<button class="rel-btn ${state.relation === r.label ? 'active' : ''}" onclick="selectRelation('${r.label}')">${r.icon} ${r.label}</button>`).join('')}
      </div>
    </div>

    <div class="card">
      <p class="serif" style="font-size:17px;color:#2C2416;margin-bottom:3px;">연령대</p>
      <p style="font-size:11px;color:#B8A898;margin-bottom:14px;">복수 선택 가능</p>
      <div style="display:flex;flex-wrap:wrap;gap:8px;" id="age-chips">
        ${AGE_GROUPS.map(a => chipHTML(a, state.ageGroups.includes(a), `onclick="toggleAge('${a}')"`)).join('')}
      </div>
    </div>

    <button class="pbtn" id="step1-next" onclick="goStep(2)" ${!state.relation || !state.ageGroups.length ? 'disabled' : ''}>다음 단계 →</button>
  `;
            }

            // ===== STEP 2 =====
            function renderStep2() {
                const el = document.getElementById('step2');
                el.classList.remove('hidden');
                el.innerHTML = `
    <div class="card">
      <p class="serif" style="font-size:17px;color:#2C2416;margin-bottom:14px;">여행지 선택</p>
      <div style="display:flex;flex-wrap:wrap;gap:8px;" id="region-chips">
        ${REGIONS.map(r => chipHTML(r, state.region === r, `onclick="selectRegion('${r}')"`)).join('')}
      </div>
    </div>

            function attractionHTML(a, i) {
                const catColors = {
                    맛집: '#E8F5E9',

                    자연: '#E0F2F1',

      </div>
    </div>`;
            }

            // ===== INTERACTIONS =====
            function changeNum(field, delta, min = 0, max = 20) {
                if (field === 'adults') min = 1;
                state[field] = Math.min(
                    max,
                    Math.max(min, state[field] + delta),
                );
                const el = document.getElementById(`${field}-val`);
                if (el) el.textContent = state[field];
                if (field === 'nights') {
                    document.getElementById('nights-label').textContent =
                        `${state.nights}박 ${state.nights + 1}일`;
                }
            }

            function selectRelation(val) {
                state.relation = val;
                document
                    .querySelectorAll('#relation-btns .rel-btn')
                    .forEach(b => {
                        b.classList.toggle(
                            'active',
                            b.textContent.includes(val),
                        );
                    });
                checkStep1();
            }

            function toggleAge(val) {
                const idx = state.ageGroups.indexOf(val);
                if (idx > -1) state.ageGroups.splice(idx, 1);
                else state.ageGroups.push(val);
                document.querySelectorAll('#age-chips .chip').forEach(b => {
                    b.classList.toggle(
                        'active',
                        state.ageGroups.includes(b.textContent),
                    );
                });
                checkStep1();
            }

            function selectRegion(val) {
                state.region = val;
                document.querySelectorAll('#region-chips .chip').forEach(b => {
                    b.classList.toggle('active', b.textContent === val);
                });
                checkStep2();
            }

            function selectBudget(label, sub) {
                state.budget = sub;
                state.budgetLabel = label;
                document.querySelectorAll('.brow').forEach(b => {
                    b.classList.toggle(
                        'active',
                        b.querySelector('.serif').textContent === label,
                    );
                    b.querySelector('.serif').style.color =
                        b.classList.contains('active') ? '#6B5233' : '#2C2416';
                });
                checkStep2();
            }

            function togglePurpose(val) {
                const idx = state.purposes.indexOf(val);
                if (idx > -1) state.purposes.splice(idx, 1);
                else state.purposes.push(val);
                document.querySelectorAll('#purpose-chips .chip').forEach(b => {
                    b.classList.toggle(
                        'active',
                        state.purposes.includes(b.textContent),
                    );
                });
                document.getElementById('step3-next').disabled =
                    !state.purposes.length;
            }

            function checkStep1() {
                const btn = document.getElementById('step1-next');
                if (btn)
                    btn.disabled = !state.relation || !state.ageGroups.length;
            }
            function checkStep2() {
                const btn = document.getElementById('step2-next');
                if (btn) btn.disabled = !state.region || !state.budget;
            }

            function toggleDetail(btn) {
                const detail = btn.nextElementSibling;
                const arrow = btn.querySelector('span:last-child');
                detail.classList.toggle('hidden');
                arrow.style.transform = detail.classList.contains('hidden')
                    ? 'rotate(0deg)'
                    : 'rotate(180deg)';
            }

            function goStep(s) {
                ['step1', 'step2', 'step3', 'step4'].forEach(id =>
                    document.getElementById(id).classList.add('hidden'),
                );
                document
                    .getElementById('step-indicator')
                    .classList.remove('hidden');
                state.step = s;
                renderStepIndicator();
                if (s === 1) renderStep1();
                else if (s === 2) renderStep2();
                else if (s === 3) renderStep3();
            }

            async function submitHotels() {
                document.getElementById('error-msg').classList.add('hidden');
                renderStepIndicator({ allDone: true });
                try {
                    const parsed = await callGemini(
                        hotelPrompt(),
                        '최적의 호텔을 찾고 있습니다…',
                    );
                    state.summary = parsed.summary;
                    state.results = parsed.hotels;
                    state.step = 4;
                    renderStep4();
                } catch (e) {
                    hideLoading();
                    renderStepIndicator();
                    document.getElementById('step3').classList.remove('hidden');
                    showError(
                        e.message ||
                            '호텔 추천을 불러오는 중 문제가 발생했습니다.',
                    );
                }
            }

            async function selectHotel(i) {
                state.selectedHotel = state.results[i];
                // 그리드 리렌더
                document.querySelector('.hotel-grid').innerHTML = state.results
                    .map((h, idx) => hotelSelectCardHTML(h, idx))
                    .join('');
                document.getElementById('selected-hotel-detail').innerHTML =
                    hotelDetailHTML(state.selectedHotel, i);
                document.getElementById('attractions-container').innerHTML = '';
                document
                    .getElementById('attr-loading')
                    .classList.remove('hidden');
                try {
                    const parsed = await callGemini(
                        attrPrompt(state.selectedHotel),
                        '주변 놀거리를 찾고 있습니다…',
                        false,
                    );
                    state.attrSummary = parsed.summary;
                    state.attractions = parsed.attractions;
                    document
                        .getElementById('attr-loading')
                        .classList.add('hidden');
                    const ac = document.getElementById('attractions-container');
                    ac.innerHTML = `
      <div style="display:flex;align-items:center;gap:10px;margin:0 0 12px;">
        <div style="flex:1;height:1px;background:linear-gradient(90deg,transparent,#DDD5C8);"></div>
        <p style="font-size:11px;color:#A68558;letter-spacing:0.15em;text-transform:uppercase;margin:0;white-space:nowrap;">📍 주변 추천 명소</p>
        <div style="flex:1;height:1px;background:linear-gradient(90deg,#DDD5C8,transparent);"></div>
      </div>
      <p class="serif" style="font-size:15px;font-style:italic;color:#8A7560;text-align:center;margin-bottom:16px;line-height:1.7;">${parsed.summary}</p>
      ${parsed.attractions.map((a, i) => attractionHTML(a, i)).join('')}`;
                } catch (e) {
                    console.error('주변 명소 로딩 실패:', e);
                    document
                        .getElementById('attr-loading')
                        .classList.add('hidden');
                    document.getElementById('attractions-container').innerHTML =
                        `
      <p style="text-align:center;color:#c0392b;font-size:13px;padding:1rem;background:#fff;border-radius:12px;border:1px solid #DDD5C8;">
        ${e.message || '주변 명소를 불러오는 중 문제가 발생했습니다.'}
      </p>`;
                }
            }

            function resetAll() {
                state = {
                    step: 1,
                    adults: 2,
                    children: 0,
                    ageGroups: [],
                    relation: '',
                    region: '',
                    nights: 2,
                    budget: '',
                    budgetLabel: '',
                    purposes: [],
                    extra: '',
                    results: null,
                    summary: '',
                    selectedHotel: null,
                    attractions: null,
                    attrSummary: '',
                };
                ['step2', 'step3', 'step4', 'loading'].forEach(id =>
                    document.getElementById(id).classList.add('hidden'),
                );
                document.getElementById('error-msg').classList.add('hidden');
                document
                    .getElementById('step-indicator')
                    .classList.remove('hidden');
                renderStepIndicator();
                renderStep1();
                document.getElementById('step1').classList.remove('hidden');
            }
